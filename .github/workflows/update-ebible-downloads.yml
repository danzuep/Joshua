name: Update eBible downloads

on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '25'
    - uses: gradle/actions/setup-gradle@v6
    - name: Regenerate ebible_downloads.tsv
      run: ./gradlew updateEbibleDownloads
    - name: Open a pull request if the list changed
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if git diff --quiet; then
          echo "No changes"
          exit 0
        fi
        branch=update-ebible-downloads-$(date +%Y%m%d)
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git checkout -b "$branch"
        git commit -am "Update ebible_downloads.tsv"
        git push origin "$branch"
        gh pr create --title "Update ebible_downloads.tsv" --body "Regenerated from https://ebible.org/download.php" --base "${GITHUB_REF_NAME}"
