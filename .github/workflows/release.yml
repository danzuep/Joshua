name: Release APK
on:
  push:
    tags:
    - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '25'
    - uses: gradle/actions/setup-gradle@v6
    - name: Restore signing keystore (optional)
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          {
            echo "KEYSTORE_FILE=release.keystore"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } > keystore.properties
        fi
    - name: Resolve version
      run: |
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "NAME=Joshua-${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
        else
          echo "VERSION=" >> "$GITHUB_ENV"
          echo "NAME=Joshua-${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"
        fi
    - name: Build APK
      run: |
        ./gradlew testDebugUnitTest assembleRelease ${VERSION:+-PappVersion=$VERSION}
        cp app/build/outputs/apk/release/app-release.apk "$NAME.apk"
    - name: Download the WEB Bible to prepackage
      run: |
        mkdir -p bundled-assets/bundled/translations
        curl -fsSL "https://ebible.org/Scriptures/engwebu_usfm.zip" -o bundled-assets/bundled/translations/engwebu.zip
        printf 'engwebu\tWorld English Bible Updated\teng\n' > bundled-assets/bundled/list.tsv
    - name: Build APK with the WEB Bible prepackaged
      run: |
        ./gradlew assembleRelease -PbundledAssetsDir="$PWD/bundled-assets" ${VERSION:+-PappVersion=$VERSION}
        cp app/build/outputs/apk/release/app-release.apk "$NAME-with-WEB.apk"
    - uses: actions/upload-artifact@v7
      with:
        name: apk
        path: Joshua-*.apk
    - name: Publish GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "$GITHUB_REF_NAME" "$NAME.apk" "$NAME-with-WEB.apk" --generate-notes
